<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS // SHADOW TRACE - System Boot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home" class="crt-flicker">
  <div class="scanlines"></div>

  <div id="app">
    <!-- GLOBAL HUD HEADER -->
    <header class="hud-header">
      <div class="hud-brand">
        <span class="status-indicator"></span>
        <div class="hud-logo">NEXUS // SHADOW TRACE</div>
        <span class="hud-tag">v4.0.9</span>
      </div>

      <div class="hud-stats">
        <div class="hud-stat-item">SYSTEM: <span class="val">ONLINE</span></div>
        <div class="hud-stat-item">SESSION: <span class="val" id="hudSessionId">NX-8492-7719</span></div>
        <div class="hud-stat-item">TIME: <span class="val" id="hudLiveTime">00:00:00 UTC</span></div>
        <div class="hud-stat-item">STATUS: <span class="val" style="color:var(--neon-green)">ACTIVE</span></div>
        <button id="soundToggleBtn" class="sound-toggle-btn">🔊 SOUND: ON</button>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-container">
      <div class="boot-page">
        <div class="boot-box cyber-panel">
          <div class="boot-header-title">NEXUS SYSTEM INITIALIZING...</div>
          
          <div id="bootTerminalLog" class="boot-terminal-log">
            <!-- Boot sequence lines inserted dynamically via app.js -->
          </div>

          <div id="bootActions" class="boot-actions">
            <button class="cyber-btn" data-target="terminal.html">
              [ ENTER SYSTEM ]
            </button>
            <div class="boot-subtext">FICTIONAL CYBERSECURITY SIMULATION</div>
          </div>
        </div>
      </div>
    </main>

    <!-- GLOBAL FOOTER -->
    <footer class="hud-footer">
      FICTIONAL CYBERSECURITY SIMULATION | NO REAL SYSTEMS ACCESSED
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
